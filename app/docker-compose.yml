# Nur für lokale Entwicklung / Portierbarkeits-Nachweis.
# Zeigt, dass die Applikation ohne Azure-Abhängigkeiten gegen einen beliebigen
# SQL Server (hier: SQL Server 2022 im Container) lauffähig ist.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalDev!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_SERVER: db
      DB_NAME: master
      DB_USER: sa
      DB_PASSWORD: "LocalDev!Passw0rd"
    depends_on:
      db:
        condition: service_healthy
