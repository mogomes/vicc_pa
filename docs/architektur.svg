<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>

  <!-- ================= Internet / Clients ================= -->
  <g>
    <rect x="40" y="300" width="220" height="200" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="150" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Internet</text>
    <!-- Browser -->
    <rect x="60" y="345" width="180" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Webbrowser</text>
    <text x="150" y="390" text-anchor="middle" font-size="12" fill="#444">HTML-Oberfläche  /</text>
    <!-- API client -->
    <rect x="60" y="420" width="180" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">API-Client</text>
    <text x="150" y="465" text-anchor="middle" font-size="12" fill="#444">JSON  /api/items</text>
  </g>

  <!-- ================= Azure Subscription ================= -->
  <g>
    <rect x="330" y="60" width="1030" height="560" rx="10" fill="#f3f8fd" stroke="#2f6db5" stroke-width="2"/>
    <text x="350" y="88" font-size="16" font-weight="bold" fill="#1f4e86">Microsoft Azure – Region Switzerland North</text>
    <text x="350" y="108" font-size="12" fill="#1f4e86">Resource Group  rg-vicc-prod</text>
  </g>

  <!-- Container Apps Environment -->
  <g>
    <rect x="360" y="140" width="560" height="330" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="380" y="166" font-size="14" font-weight="bold" fill="#1f4e86">Azure Container Apps Environment (PaaS)</text>
    <text x="380" y="184" font-size="12" fill="#1f4e86">cae-vicc-prod · Consumption-Plan · verwaltetes TLS · Log-Anbindung</text>

    <!-- Ingress -->
    <rect x="380" y="210" width="130" height="200" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="445" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Ingress</text>
    <text x="445" y="262" text-anchor="middle" font-size="11" fill="#444">HTTPS extern</text>
    <text x="445" y="279" text-anchor="middle" font-size="11" fill="#444">TLS-Terminierung</text>
    <text x="445" y="296" text-anchor="middle" font-size="11" fill="#444">Lastverteilung</text>
    <text x="445" y="313" text-anchor="middle" font-size="11" fill="#444">Port 443 → 8000</text>

    <!-- Container App -->
    <rect x="540" y="210" width="360" height="245" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="720" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Container App  ca-vicc-prod-web</text>
    <text x="720" y="254" text-anchor="middle" font-size="11" fill="#444">Image cyxeon/vicc-inventory · 0.25 vCPU / 0.5 GiB je Replica</text>

    <!-- Replicas -->
    <g>
      <rect x="560" y="272" width="95" height="70" rx="4" fill="#fdfdfd" stroke="#555" stroke-width="1.2"/>
      <text x="607" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Replica 1</text>
      <text x="607" y="318" text-anchor="middle" font-size="10" fill="#444">Container</text>

      <rect x="672" y="272" width="95" height="70" rx="4" fill="#fdfdfd" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="719" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Replica 2</text>
      <text x="719" y="318" text-anchor="middle" font-size="10" fill="#777">bei Last</text>

      <rect x="784" y="272" width="95" height="70" rx="4" fill="#fdfdfd" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="831" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">… Replica 5</text>
      <text x="831" y="318" text-anchor="middle" font-size="10" fill="#777">bei Last</text>
    </g>

    <rect x="560" y="356" width="320" height="84" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
    <text x="720" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Autoscaling (KEDA, HTTP-Regel)</text>
    <text x="720" y="394" text-anchor="middle" font-size="11" fill="#444">min 1 / max 5 Replicas · +1 Replica ab 20 gleichzeitigen Requests</text>
    <text x="720" y="412" text-anchor="middle" font-size="11" fill="#444">Liveness/Readiness-Probe  GET /health</text>
    <text x="720" y="430" text-anchor="middle" font-size="11" fill="#444">Secret  sql-password → ENV DB_PASSWORD</text>
  </g>

  <!-- Azure SQL -->
  <g>
    <rect x="960" y="140" width="370" height="200" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="980" y="166" font-size="14" font-weight="bold" fill="#1f4e86">Azure SQL Database (DBaaS)</text>
    <text x="980" y="184" font-size="12" fill="#1f4e86">Logischer Server  sql-vicc-prod-zvp5y6</text>

    <rect x="980" y="200" width="330" height="125" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="1145" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sqldb-vicc-prod</text>
    <text x="1145" y="245" text-anchor="middle" font-size="11" fill="#444">General Purpose · Serverless · Gen5</text>
    <text x="1145" y="262" text-anchor="middle" font-size="11" fill="#444">0.5 – 1 vCore · Auto-Pause konfigurierbar</text>
    <text x="1145" y="279" text-anchor="middle" font-size="11" fill="#444">max. 2 GB · TDE · lokal redundant</text>
    <text x="1145" y="296" text-anchor="middle" font-size="11" fill="#444">Firewall: «Allow Azure services»</text>
    <text x="1145" y="313" text-anchor="middle" font-size="11" fill="#444">TLS 1.2 · SQL-Authentifizierung</text>
  </g>

  <!-- Log Analytics -->
  <g>
    <rect x="960" y="370" width="370" height="100" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="980" y="396" font-size="14" font-weight="bold" fill="#1f4e86">Azure Log Analytics</text>
    <text x="980" y="414" font-size="12" fill="#1f4e86">log-vicc-prod · PerGB2018 · 30 Tage</text>
    <text x="980" y="440" font-size="11" fill="#444">System- und Konsolen-Logs der Container App,</text>
    <text x="980" y="456" font-size="11" fill="#444">Abfrage per KQL (Betrieb, Fehlersuche, Skalierungsnachweis)</text>
  </g>

  <!-- Legend inside Azure -->
  <g>
    <rect x="360" y="500" width="570" height="100" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="380" y="522" font-size="12" font-weight="bold" fill="#333">Terraform-verwaltete Ressourcen (9)</text>
    <text x="380" y="540" font-size="10.5" fill="#444">azurerm_resource_group · azurerm_log_analytics_workspace · azurerm_container_app_environment</text>
    <text x="380" y="555" font-size="10.5" fill="#444">azurerm_container_app · azurerm_mssql_server · azurerm_mssql_database · azurerm_mssql_firewall_rule</text>
    <text x="380" y="570" font-size="10.5" fill="#444">random_password · random_string</text>
    <text x="380" y="590" font-size="10.5" fill="#666">Durchgezogen: Datenfluss zur Laufzeit · Gestrichelt: Bereitstellung (Deployment / IaC)</text>
  </g>

  <!-- ================= Build & Deploy ================= -->
  <g>
    <!-- GitHub -->
    <rect x="40" y="660" width="300" height="150" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
    <text x="190" y="686" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">GitHub  mogomes/vicc_pa</text>
    <text x="190" y="706" text-anchor="middle" font-size="11" fill="#444">Öffentliches Repository</text>
    <rect x="60" y="720" width="120" height="70" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="120" y="745" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">app/</text>
    <text x="120" y="762" text-anchor="middle" font-size="10" fill="#444">Source, Dockerfile</text>
    <text x="120" y="777" text-anchor="middle" font-size="10" fill="#444">Workflow</text>
    <rect x="200" y="720" width="120" height="70" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
    <text x="260" y="745" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">infra/</text>
    <text x="260" y="762" text-anchor="middle" font-size="10" fill="#444">Terraform</text>
    <text x="260" y="777" text-anchor="middle" font-size="10" fill="#444">(*.tf)</text>

    <!-- GitHub Actions -->
    <rect x="400" y="680" width="200" height="90" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
    <text x="500" y="708" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">GitHub Actions</text>
    <text x="500" y="728" text-anchor="middle" font-size="11" fill="#444">docker build &amp; push</text>
    <text x="500" y="745" text-anchor="middle" font-size="11" fill="#444">bei Push auf main</text>

    <!-- Docker Hub -->
    <rect x="660" y="680" width="220" height="90" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
    <text x="770" y="708" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Docker Hub</text>
    <text x="770" y="728" text-anchor="middle" font-size="11" fill="#444">cyxeon/vicc-inventory</text>
    <text x="770" y="745" text-anchor="middle" font-size="11" fill="#444">:latest · :&lt;commit-sha&gt; · öffentlich</text>

    <!-- Terraform workstation -->
    <rect x="960" y="680" width="370" height="90" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="1.5"/>
    <text x="1145" y="708" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Terraform CLI (Arbeitsplatz)</text>
    <text x="1145" y="728" text-anchor="middle" font-size="11" fill="#444">azurerm-Provider 4.x · az login</text>
    <text x="1145" y="745" text-anchor="middle" font-size="11" fill="#444">terraform plan / apply · lokaler State</text>
  </g>

  <!-- ================= Arrows: runtime (solid) ================= -->
  <!-- Browser / API -> Ingress -->
  <line x1="240" y1="375" x2="380" y2="300" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="240" y1="450" x2="380" y2="320" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="265" y="340" font-size="11" fill="#333" font-weight="bold">HTTPS 443</text>

  <!-- Ingress -> Container App -->
  <line x1="510" y1="307" x2="540" y2="307" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Container App -> SQL -->
  <line x1="900" y1="262" x2="980" y2="262" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="940" y="252" text-anchor="middle" font-size="10" fill="#333">TDS/TLS</text>
  <text x="940" y="280" text-anchor="middle" font-size="10" fill="#333">1433</text>

  <!-- Container App -> Log Analytics -->
  <line x1="900" y1="420" x2="960" y2="420" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="930" y="410" text-anchor="middle" font-size="10" fill="#333">Logs</text>

  <!-- ================= Arrows: deployment (dashed) ================= -->
  <!-- GitHub -> Actions -->
  <line x1="340" y1="725" x2="400" y2="725" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <!-- Actions -> Docker Hub -->
  <line x1="600" y1="725" x2="660" y2="725" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="630" y="715" text-anchor="middle" font-size="10" fill="#555">push</text>
  <!-- Docker Hub -> Container App (image pull) -->
  <path d="M770,680 L770,640 L945,640 L945,440 L900,440" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="952" y="492" font-size="10" fill="#555">Image Pull</text>
  <!-- Terraform -> Azure (provisioning) -->
  <path d="M1145,680 L1145,620" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="1160" y="655" font-size="10" fill="#555">Azure Resource Manager API</text>
  <!-- GitHub infra -> Terraform -->
  <path d="M260,790 L260,835 L1145,835 L1145,770" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="700" y="828" text-anchor="middle" font-size="10" fill="#555">git clone (infra/*.tf)</text>
</svg>
