# Baut das Container-Image und veröffentlicht es auf Docker Hub.
# Benötigte Repository-Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Access Token mit Read/Write).
name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: |
            cyxeon/vicc-inventory:latest
            cyxeon/vicc-inventory:${{ github.sha }}
